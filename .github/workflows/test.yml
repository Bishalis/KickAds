# Runs the automated tests on every push and pull request.
#   checks:   lint, typecheck, unit tests, API tests, production build (every push)
#   database: applies all migrations to a fresh Postgres and checks the safety rules (every push)
#   browser:  Playwright browser tests (pull requests to main). The signed-in tests also run if
#             the repository has E2E_SUPABASE_URL, E2E_SUPABASE_PUBLISHABLE_KEY, and
#             E2E_SUPABASE_SERVICE_ROLE_KEY secrets for a separate test Supabase project.
name: Tests

on:
  push:
  pull_request:
    branches: [main]

env:
  # Placeholders so the app builds; no test here talks to a real service.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the preinstalled Postgres tools on the PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - run: bash test/db/check-migrations.sh

  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Use the test Supabase project, if configured
        env:
          URL: ${{ secrets.E2E_SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$URL" ]; then
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$URL" "$PUBLISHABLE_KEY" "$SERVICE_ROLE_KEY" > .env.e2e
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
